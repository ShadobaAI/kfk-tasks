[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-adapter-memory-bank"
version = "0.2.0"
description = "Local Markdown Memory Bank and MCP server for kafka-adapter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anyio>=4.5,<5",
  "mcp>=1.27.2,<2",
  "PyYAML>=6.0",
  "starlette>=0.27,<2",
  "uvicorn>=0.31,<1"
]

[project.scripts]
memory-bank = "memory_bank_mcp.cli:main"
memory-bank-mcp = "memory_bank_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
